<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du produit | Fedya Glow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <nav class="navbar scrolled">
        <div class="container">
            <a href="index.html" class="nav-logo gold-text">FEDYA GLOW</a>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="products.html">Boutique</a></li>
                <li><a href="about.html">À propos</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon">
                    <i data-lucide="shopping-bag"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 10rem 0 6rem;">
        <a href="products.html" style="color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 3rem;">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Retour à la boutique
        </a>

        <div id="product-content" class="product-details-grid">
            <!-- Content loaded by JS -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 5rem;">
                <p>Chargement du produit...</p>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        async function initProductPage() {
            // Wait for all products to be loaded dynamically
            await loadAllProducts();
            
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) { 
                window.location.href = 'products.html'; 
                return; 
            }

            try {
                // Find in the globally loaded productsData
                const product = window.productsData.find(p => String(p.id) === String(id));
                if (!product) throw new Error('Produit non trouvé');
                
                // Render using the centralized logic in main.js
                renderProductDetails(product);
            } catch (err) {
                console.error(err);
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 5rem;">
                        <h2 style="margin-bottom: 1.5rem;">Produit non trouvé</h2>
                        <a href="products.html" class="btn-gold">Retour à la boutique</a>
                    </div>
                `;
            }
        }

        initProductPage();
    </script>
</body>
</html>
