<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique | Fedya Glow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .category-filter {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 9999px;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
    </style>
</head>
<body>

    <!-- Navbar (same as index) -->
    <nav class="navbar scrolled">
        <div class="container">
            <a href="index.html" class="nav-logo gold-text">FEDYA GLOW</a>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="products.html">Boutique</a></li>
                <li><a href="about.html">À propos</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon">
                    <i data-lucide="shopping-bag"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 10rem; padding-bottom: 6rem;">
        <div style="margin-bottom: 4rem;">
            <span class="gold-text" style="text-transform: uppercase; letter-spacing: 0.3em; font-size: 0.7rem; font-weight: bold; margin-bottom: 1rem; display: block;">Collections</span>
            <h1 style="font-size: 3.5rem;">Découvrez notre univers</h1>
            <div style="width: 100px; height: 3px; background-color: var(--gold); margin-top: 1.5rem;"></div>
        </div>

        <!-- Filters -->
        <div style="margin-bottom: 3rem;">
            <div id="category-filters" class="category-filter" style="margin-bottom: 1rem;">
                <button class="filter-btn active" onclick="handleCategoryFilter('all', this)">Tous</button>
            </div>
            <div id="subcategory-filters" class="category-filter" style="display: none; padding-left: 2rem; border-left: 2px solid var(--gold); margin-left: 1rem;">
                <!-- Dynamic subcategories -->
            </div>
        </div>

        <!-- Grid -->
        <div id="products-grid" class="product-grid">
            <!-- Loaded by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container" style="text-align: center; color: #666; font-size: 0.8rem;">
            <p>&copy; 2026 Fedya Glow. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
        
        let currentCategory = 'all';
        let currentSubcategory = 'all';

        function handleCategoryFilter(category, btn) {
            document.querySelectorAll('#category-filters .filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            currentCategory = category;
            currentSubcategory = 'all';
            
            renderSubcategoryFilters(category);
            applyFilters();
        }

        function handleSubcategoryFilter(subcat, btn) {
            document.querySelectorAll('#subcategory-filters .filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            currentSubcategory = subcat;
            applyFilters();
        }

        function applyFilters() {
            const filtered = filterByCategory(currentCategory, currentSubcategory);
            renderProducts(filtered, 'products-grid');
        }

        function renderCategoryFilters(products) {
            const container = document.getElementById('category-filters');
            if (!container) return;

            const categories = Object.keys(state.categories).sort();
            
            // Clear but keep 'Tous'
            const allBtn = container.querySelector('.filter-btn');
            container.innerHTML = '';
            container.appendChild(allBtn);

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = cat;
                btn.onclick = () => handleCategoryFilter(cat, btn);
                container.appendChild(btn);
            });
        }

        function renderSubcategoryFilters(category) {
            const container = document.getElementById('subcategory-filters');
            if (!container) return;

            if (category === 'all' || !state.categories[category] || state.categories[category].length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            container.innerHTML = '<button class="filter-btn active" onclick="handleSubcategoryFilter(\'all\', this)">Tout dans ' + category + '</button>';

            state.categories[category].forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = sub;
                btn.onclick = () => handleSubcategoryFilter(sub, btn);
                container.appendChild(btn);
            });
        }

        async function initProductsPage() {
            const products = await loadAllProducts();
            renderCategoryFilters(products);
            
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category') || 'all';
            
            if (category !== 'all') {
                const btn = Array.from(document.querySelectorAll('#category-filters .filter-btn')).find(b => b.textContent.trim() === category);
                handleCategoryFilter(category, btn);
            } else {
                renderProducts(products, 'products-grid');
            }
        }

        document.addEventListener('DOMContentLoaded', initProductsPage);
    </script>
</body>
</html>
